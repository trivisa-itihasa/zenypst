name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Zenypst ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  update-release-notes:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for changelog generation

      - name: Generate release notes and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.ref_name }}"

          # Find previous tag for commit range
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")

          # Generate categorized changelog from commits since previous tag
          CHANGELOG=""
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$'## Changes\n\n'

            # Features (conventional commit: feat: / feat(...): )
            FEATURES=$(git log --pretty=format:"- %s" "$PREV_TAG..$TAG" --no-merges --perl-regexp --grep="^feat[(:]" 2>/dev/null | sed 's/^feat[^:]*: //' || true)
            if [ -n "$FEATURES" ]; then
              CHANGELOG="${CHANGELOG}"$'### Features\n'"${FEATURES}"$'\n\n'
            fi

            # Bug fixes (conventional commit: fix: / fix(...): )
            FIXES=$(git log --pretty=format:"- %s" "$PREV_TAG..$TAG" --no-merges --perl-regexp --grep="^fix[(:]" 2>/dev/null | sed 's/^fix[^:]*: //' || true)
            if [ -n "$FIXES" ]; then
              CHANGELOG="${CHANGELOG}"$'### Bug Fixes\n'"${FIXES}"$'\n\n'
            fi

            # Performance (perf:)
            PERF=$(git log --pretty=format:"- %s" "$PREV_TAG..$TAG" --no-merges --perl-regexp --grep="^perf[(:]" 2>/dev/null | sed 's/^perf[^:]*: //' || true)
            if [ -n "$PERF" ]; then
              CHANGELOG="${CHANGELOG}"$'### Performance\n'"${PERF}"$'\n\n'
            fi

            # Refactoring (refactor:)
            REFACTOR=$(git log --pretty=format:"- %s" "$PREV_TAG..$TAG" --no-merges --perl-regexp --grep="^refactor[(:]" 2>/dev/null | sed 's/^refactor[^:]*: //' || true)
            if [ -n "$REFACTOR" ]; then
              CHANGELOG="${CHANGELOG}"$'### Refactoring\n'"${REFACTOR}"$'\n\n'
            fi

            # Other non-merge commits that don't match above prefixes
            OTHER=$(git log --pretty=format:"- %s" "$PREV_TAG..$TAG" --no-merges --perl-regexp --invert-grep --grep="^(feat|fix|perf|refactor)[(:]" 2>/dev/null || true)
            if [ -n "$OTHER" ]; then
              CHANGELOG="${CHANGELOG}"$'### Other Changes\n'"${OTHER}"$'\n\n'
            fi
          fi

          # Generate GitHub auto notes for the comparison link ("Full Changelog: vX...vY")
          GENERATED_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="$TAG" --jq '.body')
          COMPARISON_LINK=$(echo "$GENERATED_NOTES" | grep -F "**Full Changelog**:" || true)

          # Fetch release assets and label them by platform
          ASSETS_MD=$(python3 << 'PYEOF'
          import json, os, subprocess
          
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          
          # Fetch assets from the release
          result = subprocess.run(
              ["gh", "release", "view", tag, "--repo", repo, "--json", "assets"],
              capture_output=True, text=True
          )
          if result.returncode != 0:
              print("")
              exit(0)
          assets = json.loads(result.stdout).get("assets", [])
          
          # Platform detection by file extension
          PLATFORM_MAP = {
              ".dmg": "**macOS** (Universal)",
              ".app.tar.gz": "**macOS** (Universal)",
              "-setup.exe": "**Windows** (Installer)",
              ".msi": "**Windows** (MSI)",
              ".deb": "**Ubuntu / Debian**",
              ".AppImage": "**Linux** (AppImage)",
              ".rpm": "**Fedora / RHEL**",
              ".sig": None,
              "latest.json": None,
          }
          
          lines = []
          for a in assets:
              name = a["name"]
              label = None
              for ext, lbl in PLATFORM_MAP.items():
                  if name.endswith(ext):
                      label = lbl
                      break
              if label is None:
                  continue
              lines.append(f"- {label}: `{name}`")
          
          # Sort: macOS first, then Windows, then Linux
          order = {"macOS": 0, "Windows": 1, "Ubuntu": 2, "Fedora": 3, "Linux": 4}
          def sort_key(line):
              for platform, idx in order.items():
                  if platform in line:
                      return idx
              return 9
          lines.sort(key=sort_key)
          
          if lines:
              print("## Assets\n")
              for l in lines:
                  print(l)
          PYEOF
          )

          # Combine: changelog + comparison link + assets
          FULL_BODY="${CHANGELOG}"
          if [ -n "$COMPARISON_LINK" ]; then
            FULL_BODY="${FULL_BODY}"$'\n'"${COMPARISON_LINK}"$'\n'
          fi
          if [ -n "$ASSETS_MD" ]; then
            FULL_BODY="${FULL_BODY}"$'\n'"${ASSETS_MD}"
          fi

          # Update release body
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --notes "$FULL_BODY"

