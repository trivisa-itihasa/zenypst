name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Zenypst ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  update-release-notes:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Update latest.json URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p ./assets

          # Download current latest.json
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern "latest.json" --dir ./assets

          # Update URLs to match actual asset names (remove version numbers from filenames in URLs)
          python3 << 'EOF'
          import json
          import re
          from urllib.parse import urlparse, urlunparse

          with open('./assets/latest.json', 'r') as f:
              data = json.load(f)

          for platform, info in data.get('platforms', {}).items():
              url = info.get('url', '')
              parsed = urlparse(url)
              path = parsed.path
              filename = path.split('/')[-1]

              # Remove version patterns from filename only
              # Pattern: _X.Y.Z or _X.Y.Z_N (e.g., Zenypst_0.3.3_amd64.AppImage -> Zenypst_amd64.AppImage)
              new_filename = re.sub(r'_[0-9]+\.[0-9]+\.[0-9]+(_[0-9]+)?', '', filename)
              # Pattern: -X.Y.Z-N (for RPM, e.g., Zenypst-0.3.3-1.x86_64.rpm -> Zenypst.x86_64.rpm)
              new_filename = re.sub(r'-[0-9]+\.[0-9]+\.[0-9]+-[0-9]+', '', new_filename)

              # Reconstruct path
              new_path = '/'.join(path.split('/')[:-1] + [new_filename])
              parsed = parsed._replace(path=new_path)
              info['url'] = urlunparse(parsed)

          with open('./assets/latest.json', 'w') as f:
              json.dump(data, f, indent=2)
          EOF

          # Re-upload latest.json
          gh release upload "$TAG" "./assets/latest.json" --repo "${{ github.repository }}" --clobber

          rm -rf ./assets

      - name: Generate release notes and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"

          # Extract changes from annotated tag message
          TAG_CHANGES=$(git tag -l --format='%(contents)' "$TAG" | sed -n '/^Changes:/,$p' | tail -n +2)

          if [ -n "$TAG_CHANGES" ]; then
            CHANGELOG=$(printf '## Changes\n%s\n\n' "$TAG_CHANGES")
          else
            CHANGELOG=""
          fi

          # Generate automatic release notes via GitHub API
          GENERATED_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="$TAG" --jq '.body')

          DOWNLOAD_GUIDE="
          ## Download Guide

          | File | Platform | Description |
          |------|----------|-------------|
          | \`Zenypst_${TAG#v}_universal.dmg\` | **macOS** (Apple Silicon + Intel) | Disk image installer |
          | \`Zenypst_${TAG#v}_universal.app.tar.gz\` | **macOS** (Apple Silicon + Intel) | App bundle (for Sparkle updater) |
          | \`Zenypst_${TAG#v}_x64-setup.exe\` | **Windows** (64-bit) | NSIS installer |
          | \`Zenypst_${TAG#v}_x64_en-US.msi\` | **Windows** (64-bit) | MSI installer |
          | \`zenypst_${TAG#v}_amd64.deb\` | **Linux** (Debian/Ubuntu, 64-bit) | Debian package |
          | \`zenypst_${TAG#v}_amd64.AppImage\` | **Linux** (64-bit) | Portable AppImage |
          | \`zenypst-${TAG#v}-1.x86_64.rpm\` | **Linux** (RHEL/Fedora/openSUSE, 64-bit) | RPM package |
          "

          FULL_BODY="${CHANGELOG}${GENERATED_NOTES}

          ${DOWNLOAD_GUIDE}"

          # Update release body
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --notes "$FULL_BODY"

