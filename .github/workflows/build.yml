name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Zenypst ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  update-release-notes:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Rename release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          mkdir -p ./assets

          ASSETS=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '.assets[].name')

          for asset in $ASSETS; do
            new_name=$(echo "$asset" | sed -E 's/[-_][0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?//g')

            if [ "$asset" != "$new_name" ]; then
              echo "Renaming $asset -> $new_name"

              gh release download "$TAG" --repo "${{ github.repository }}" --pattern "$asset" --dir ./assets
              mv "./assets/$asset" "./assets/$new_name"

              gh release upload "$TAG" "./assets/$new_name" --repo "${{ github.repository }}"

              ASSET_ID=$(gh api repos/${{ github.repository }}/releases/tags/$TAG --jq ".assets[] | select(.name == \"$asset\") | .id")
              gh api repos/${{ github.repository }}/releases/assets/$ASSET_ID -X DELETE
            fi
          done

          rm -rf ./assets

      - name: Generate release notes and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"

          # Generate automatic release notes via GitHub API
          GENERATED_NOTES=$(gh api repos/${{ github.repository }}/releases/generate-notes -f tag_name="$TAG" --jq '.body')

          DOWNLOAD_GUIDE="
          ## Download Guide

          | File | Platform | Description |
          |------|----------|-------------|
          | \`Zenypst_universal.dmg\` | **macOS** (Apple Silicon + Intel) | Disk image installer |
          | \`Zenypst.app.tar.gz\` | **macOS** (Apple Silicon + Intel) | App bundle (for Sparkle updater) |
          | \`Zenypst_x64-setup.exe\` | **Windows** (64-bit) | NSIS installer |
          | \`Zenypst_x64_en-US.msi\` | **Windows** (64-bit) | MSI installer |
          | \`zenypst_amd64.deb\` | **Linux** (Debian/Ubuntu, 64-bit) | Debian package |
          | \`zenypst_amd64.AppImage\` | **Linux** (64-bit) | Portable AppImage |
          | \`Zenypst.x86_64.rpm\` | **Linux** (RHEL/Fedora/openSUSE, 64-bit) | RPM package |
          "

          FULL_BODY="${GENERATED_NOTES}

          ${DOWNLOAD_GUIDE}"

          # Update release body and publish (remove draft)
          gh release edit "$TAG" \
            --repo "${{ github.repository }}" \
            --notes "$FULL_BODY" \
            --draft=false

